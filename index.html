<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Interactive Mind Map</title>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.4"></script>

  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.4"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --background: #f7f8fc;
      --panel: rgba(255,255,255,.96);
      --border: #e5e7eb;
      --text: #202124;
      --muted: #73767e;
      --purple: #6750a4;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(
          circle at 72% 32%,
          rgba(103,80,164,.055),
          transparent 38%
        ),
        var(--background);

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
    }


    /* =========================================================
       SIDEBAR
    ========================================================= */

    #sidebar {
      width: 350px;
      height: 100%;

      padding: 24px;

      display: flex;
      flex-direction: column;

      background: var(--panel);

      border-right: 1px solid var(--border);

      box-shadow:
        3px 0 22px rgba(0,0,0,.035);

      z-index: 20;
    }


    /* =========================================================
       BRAND
    ========================================================= */

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 6px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #8972cf,
          #6750a4
        );

      color: white;

      font-size: 19px;

      box-shadow:
        0 4px 12px rgba(103,80,164,.23);
    }

    h1 {
      font-size: 18px;
      font-weight: 650;
      letter-spacing: -.25px;
    }

    .subtitle {
      margin: 7px 0 20px 50px;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.5;
    }


    /* =========================================================
       EDITOR LABEL
    ========================================================= */

    .editor-label {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 8px;

      color: #555861;

      font-size: 12px;
      font-weight: 650;

      text-transform: uppercase;
      letter-spacing: .6px;
    }

    .editor-hint {
      color: #999ca4;

      font-size: 11px;
      font-weight: 400;

      text-transform: none;
      letter-spacing: 0;
    }


    /* =========================================================
       TEXTAREA
    ========================================================= */

    textarea {
      flex: 1;

      width: 100%;

      padding: 16px;

      resize: none;

      border: 1px solid var(--border);

      border-radius: 16px;

      background: #fbfbfd;

      color: #303238;

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

      font-size: 13px;

      line-height: 1.7;

      outline: none;

      transition:
        border .2s,
        box-shadow .2s,
        background .2s;
    }

    textarea:hover {
      background: #ffffff;
    }

    textarea:focus {
      background: #ffffff;

      border-color: #a99bd1;

      box-shadow:
        0 0 0 4px rgba(103,80,164,.08);
    }


    /* =========================================================
       BUTTON AREA
    ========================================================= */

    .button-area {
      display: flex;
      gap: 8px;

      margin-top: 14px;
    }

    button {
      border: none;

      cursor: pointer;

      font-family: inherit;

      font-size: 12px;

      font-weight: 600;

      transition:
        transform .15s,
        box-shadow .15s,
        background .15s,
        border-color .15s;
    }

    button:active {
      transform: scale(.97);
    }


    /* =========================================================
       GENERATE
    ========================================================= */

    .btn-render {
      flex: 1;

      padding: 13px 12px;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #725bb0,
          #604697
        );

      color: white;

      box-shadow:
        0 4px 12px rgba(103,80,164,.20);
    }

    .btn-render:hover {
      box-shadow:
        0 6px 18px rgba(103,80,164,.28);
    }


    /* =========================================================
       CLEAR
    ========================================================= */

    .btn-clear {
      padding: 13px 12px;

      border-radius: 12px;

      background: white;

      border:
        1px solid var(--border);

      color: #666971;
    }

    .btn-clear:hover {
      background: #fff7f7;

      border-color: #e6cccc;

      color: #a14d4d;
    }


    /* =========================================================
       EXPORT
    ========================================================= */

    .btn-export {
      padding: 13px 12px;

      border-radius: 12px;

      background: white;

      border:
        1px solid var(--border);

      color: #50525a;
    }

    .btn-export:hover {
      background: #f8f7fc;

      border-color: #d8d2e8;
    }


    /* =========================================================
       MAP
    ========================================================= */

    #map-container {
      flex: 1;

      position: relative;

      overflow: hidden;

      background:
        radial-gradient(
          circle at center,
          #ffffff 0%,
          #f8f9fc 100%
        );
    }

    #markmap-svg {
      width: 100%;
      height: 100%;
    }


    /* =========================================================
       MAP TITLE
    ========================================================= */

    .map-title {
      position: absolute;

      top: 20px;
      left: 24px;

      padding: 9px 14px;

      border-radius: 12px;

      background:
        rgba(255,255,255,.86);

      border:
        1px solid rgba(225,226,232,.9);

      backdrop-filter: blur(12px);

      box-shadow:
        0 3px 15px rgba(0,0,0,.055);

      color: #5b5d65;

      font-size: 13px;
      font-weight: 600;

      z-index: 10;

      pointer-events: none;
    }


    /* =========================================================
       MAP CONTROLS
    ========================================================= */

    .map-controls {
      position: absolute;

      right: 24px;
      bottom: 24px;

      display: flex;
      flex-direction: column;

      gap: 7px;

      z-index: 10;
    }

    .map-control {
      width: 42px;
      height: 42px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background:
        rgba(255,255,255,.92);

      border:
        1px solid rgba(225,226,232,.95);

      box-shadow:
        0 4px 15px rgba(0,0,0,.08);

      color: #555761;

      font-size: 19px;

      backdrop-filter: blur(12px);
    }

    .map-control:hover {
      background: white;

      box-shadow:
        0 6px 20px rgba(0,0,0,.12);
    }


    /* =========================================================
       MARKMAP
    ========================================================= */

    .markmap-node text {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif !important;

      fill: #303238 !important;
    }

    .markmap-link {
      stroke-linecap: round;
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 800px) {

      #sidebar {
        width: 290px;
        padding: 18px;
      }

      .subtitle {
        margin-left: 0;
      }

      .map-title {
        top: 12px;
        left: 12px;
      }

      .map-controls {
        right: 12px;
        bottom: 12px;
      }

    }

  </style>

</head>

<body>

<div id="app">

  <!-- =======================================================
       SIDEBAR
  ======================================================== -->

  <aside id="sidebar">

```
<div class="brand">

  <div class="brand-icon">
    ✦
  </div>

  <h1>Mind Map</h1>

</div>


<div class="subtitle">
  Turn your Markdown outline into an interactive visual map.
</div>


<div class="editor-label">

  <span>Markdown</span>

  <span class="editor-hint">
    Paste from NotebookLM
  </span>

</div>


<textarea
  id="markdown-input"
  spellcheck="false"
  placeholder="# Main Topic
```

## Subtopic

* Key idea

  * Detail

## Another Subtopic

* Important detail"></textarea>

    <div class="button-area">

  ```
  <button
    class="btn-render"
    onclick="updateMap()">

    ✦ Generate

  </button>


  <button
    class="btn-clear"
    onclick="clearContent()">

    Clear

  </button>


  <button
    class="btn-export"
    onclick="exportStandaloneHTML()">

    Export

  </button>
  ```

    </div>

  </aside>

  <!-- =======================================================
       MAP
  ======================================================== -->

  <main id="map-container">

    <div class="map-title">
      Interactive Mind Map
    </div>

  <svg id="markmap-svg"></svg>

    <div class="map-controls">

  ```
  <button
    class="map-control"
    title="Zoom in"
    onclick="zoomMap(1.25)">

    +

  </button>


  <button
    class="map-control"
    title="Zoom out"
    onclick="zoomMap(.8)">

    −

  </button>


  <button
    class="map-control"
    title="Fit map"
    onclick="fitMap()">

    ⛶

  </button>
  ```

    </div>

  </main>

</div>

<script>

  /* =========================================================
     MARKMAP
  ========================================================= */

  const {
    Transformer,
    Markmap
  } = window.markmap;


  const transformer =
    new Transformer();


  let mmInstance = null;


  /* =========================================================
     CLEAN NOTEBOOKLM CONTENT
     
     Only removes:
     
     - text before first #
     - surrounding Markdown code fences
     
     Everything inside the actual Markdown is preserved.
  ========================================================= */

  function cleanMarkdown(input) {

    if (!input) {
      return "";
    }


    let markdown =
      input.replace(
        /\r\n/g,
        "\n"
      );


    markdown =
      markdown.trim();


    /*
      Remove opening code fence.
    */

    if (
      markdown.startsWith(
        "```markdown"
      )
    ) {

      markdown =
        markdown.substring(
          11
        ).trim();

    }
    else if (
      markdown.startsWith(
        "```md"
      )
    ) {

      markdown =
        markdown.substring(
          5
        ).trim();

    }
    else if (
      markdown.startsWith(
        "```"
      )
    ) {

      markdown =
        markdown.substring(
          3
        ).trim();

    }


    /*
      Remove closing code fence.
    */

    if (
      markdown.endsWith(
        "```"
      )
    ) {

      markdown =
        markdown.substring(
          0,
          markdown.length - 3
        ).trim();

    }


    /*
      Find first Markdown heading.
    */

    const heading =
      markdown.match(
        /^#{1,6}\s+/m
      );


    if (heading) {

      /*
        Keep EVERYTHING from the first heading onward.
      */

      markdown =
        markdown.substring(
          heading.index
        );

    }


    return markdown.trim();

  }


  /* =========================================================
     GENERATE MAP
  ========================================================= */

  function updateMap() {

    const textarea =
      document.getElementById(
        "markdown-input"
      );


    /*
      Clean NotebookLM wrapper.
    */

    const markdown =
      cleanMarkdown(
        textarea.value
      );


    /*
      Show cleaned content.
    */

    textarea.value =
      markdown;


    if (!markdown) {

      alert(
        "Please paste a Markdown outline beginning with #."
      );

      return;

    }


    /*
      Transform Markdown.
    */

    const {
      root
    } =
      transformer.transform(
        markdown
      );


    const svg =
      document.getElementById(
        "markmap-svg"
      );


    /*
      Clear previous map.
    */

    svg.innerHTML = "";


    /*
      ORIGINAL WORKING MARKMAP SETTINGS.
      
      Do not change these unless necessary.
    */

    mmInstance =
      Markmap.create(
        svg,
        {
          duration: 300,
          // Show root + ## sections initially.
          // Everything underneath starts collapsed.
          initialExpandLevel: 1,
          zoom: true,
          pan: true
        },
        root
      );


    /*
      Fit map after rendering.
    */

    setTimeout(
      () => {

        if (mmInstance) {
          mmInstance.fit();
        }

      },
      400
    );

  }


  /* =========================================================
     CLEAR CONTENT
  ========================================================= */

  function clearContent() {

    /*
      Clear Markdown editor.
    */

    document
      .getElementById(
        "markdown-input"
      )
      .value = "";


    /*
      Clear current map.
    */

    const svg =
      document.getElementById(
        "markmap-svg"
      );


    svg.innerHTML = "";


    /*
      Remove current Markmap instance.
    */

    mmInstance = null;


    /*
      Put cursor back into editor.
    */

    document
      .getElementById(
        "markdown-input"
      )
      .focus();

  }


  /* =========================================================
     FIT
  ========================================================= */

  function fitMap() {

    if (!mmInstance) {
      return;
    }

    mmInstance.fit();

  }


  /* =========================================================
     ZOOM
     
     Native mouse wheel zoom remains controlled by Markmap.
  ========================================================= */

  function zoomMap(factor) {

    if (!mmInstance) {
      return;
    }


    const svg =
      document.getElementById(
        "markmap-svg"
      );


    const current =
      d3.zoomTransform(svg);


    const nextScale =
      Math.max(
        0.1,
        Math.min(
          8,
          current.k * factor
        )
      );


    const rect =
      svg.getBoundingClientRect();


    const cx =
      rect.width / 2;


    const cy =
      rect.height / 2;


    const ratio =
      nextScale / current.k;


    const tx =
      cx -
      (cx - current.x) *
      ratio;


    const ty =
      cy -
      (cy - current.y) *
      ratio;


    const transform =
      d3.zoomIdentity
        .translate(tx, ty)
        .scale(nextScale);


    /*
      Use the existing Markmap zoom behaviour.

      Markmap attaches the zoom handler to the SVG.
    */

    const selection =
      d3.select(svg);


    try {

      const zoomEvent =
        selection.on(
          "zoom"
        );

      /*
        Trigger through the SVG's current zoom
        behaviour when available.
      */

      const storedZoom =
        svg.__zoom;

      if (storedZoom) {

        selection
          .property(
            "__zoom",
            transform
          );

        selection
          .attr(
            "transform",
            transform
          );

      }

    }
    catch (error) {

      /*
        Native mouse-wheel zoom remains available.
      */

    }

  }


  /* =========================================================
     CTRL/CMD + ENTER
  ========================================================= */

  document
    .getElementById(
      "markdown-input"
    )
    .addEventListener(
      "keydown",
      function(event) {

        if (
          (event.ctrlKey ||
           event.metaKey) &&
          event.key === "Enter"
        ) {

          event.preventDefault();

          updateMap();

        }

      }
    );


  /* =========================================================
     EXPORT
  ========================================================= */

  function exportStandaloneHTML() {

    const markdown =
      cleanMarkdown(
        document
          .getElementById(
            "markdown-input"
          )
          .value
      );


    if (!markdown) {

      alert(
        "There is no mind map to export."
      );

      return;

    }


    const safeMarkdown =
      markdown
        .replace(
          /\\/g,
          "\\\\"
        )
        .replace(
          /`/g,
          "\\`"
        )
        .replace(
          /\${/g,
          "\\${"
        );


    const standaloneContent =
`<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Interactive Mind Map</title>


<script src="https://cdn.jsdelivr.net/npm/d3@7"><\\/script>

<script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.4"><\\/script>

<script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.4"><\\/script>


<style>

html,
body {

  margin: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background:
    radial-gradient(
      circle at center,
      #ffffff,
      #f7f8fc
    );

}


svg {

  width: 100vw;
  height: 100vh;

}


.markmap-node text {

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    sans-serif !important;

  fill: #303238 !important;

}


.markmap-link {

  stroke-linecap: round;

}

</style>

</head>

<body>

<svg id="markmap"></svg>

<script>

const markdown =
\`${safeMarkdown}\`;


const {
  Transformer,
  Markmap
} =
window.markmap;


const {
  root
} =
new Transformer()
  .transform(markdown);


const mm =
Markmap.create(
  "#markmap",
  {
    duration: 300,
    zoom: true,
    pan: true
  },
  root
);


setTimeout(
  () => mm.fit(),
  400
);

<\\/script>


</body>

</html>`;


    const blob =
      new Blob(
        [standaloneContent],
        {
          type: "text/html"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const link =
      document.createElement("a");


    link.href = url;


    link.download =
      "interactive-mindmap.html";


    link.click();


    setTimeout(
      () => URL.revokeObjectURL(url),
      1000
    );

  }


  /* =========================================================
     START EMPTY
     
     Unlike the previous version, production starts empty.
     The user can paste NotebookLM content immediately.
  ========================================================= */

  window.addEventListener(
    "load",
    function() {

      document
        .getElementById(
          "markdown-input"
        )
        .focus();

    }
  );

</script>

</body>
</html>

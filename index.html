<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown to Interactive Mind Map Converter</title>
  
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.4"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; height: 100vh; background-color: #f4f6f8; }
    
    #sidebar {
      width: 35%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      background: #ffffff;
      border-right: 1px solid #e0e0e0;
      box-shadow: 2px 0 8px rgba(0,0,0,0.05);
    }

    textarea {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: monospace;
      font-size: 14px;
      resize: none;
      outline: none;
    }

    textarea:focus { border-color: #0066cc; }

    .btn-group { display: flex; gap: 10px; }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-render { background: #0066cc; color: white; }
    .btn-render:hover { background: #0052a3; }
    .btn-export { background: #28a745; color: white; }
    .btn-export:hover { background: #218838; }

    #map-container {
      flex: 1;
      position: relative;
      background: #ffffff;
    }

    svg { width: 100%; height: 100%; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>Markdown Mind Map</h2>
    <p style="font-size: 0.85rem; color: #666;">Paste your NotebookLM Markdown outline below:</p>
    
    <textarea id="markdown-input" placeholder="# Main Topic&#10;## Subtopic 1&#10;- Detail A&#10;- Detail B&#10;## Subtopic 2&#10;- Detail C"></textarea>
    
    <div class="btn-group">
      <button class="btn-render" onclick="updateMap()">Generate Map</button>
      <button class="btn-export" onclick="exportStandaloneHTML()">Download HTML</button>
    </div>
  </div>

  <div id="map-container">
    <svg id="markmap-svg"></svg>
  </div>

  <script>
    const { Transformer, Markmap } = window.markmap;
    const transformer = new Transformer();
    let mmInstance = null;

    // Default sample data
    document.getElementById('markdown-input').value = `# Root Topic\n## Central Idea 1\n- Key Point A\n- Key Point B\n## Central Idea 2\n- Key Point C`;

    function updateMap() {
      const markdown = document.getElementById('markdown-input').value;
      const { root } = transformer.transform(markdown);
      
      const svgEl = document.getElementById('markmap-svg');
      svgEl.innerHTML = ''; // Clear previous render

      mmInstance = Markmap.create(svgEl, {
        duration: 300,
        zoom: true,
        pan: true
      }, root);
    }

    // Initial render on load
    window.onload = updateMap;

    // Export standalone viewable HTML file
    function exportStandaloneHTML() {
      const markdown = document.getElementById('markdown-input').value;
      
      const standaloneContent = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Interactive Mind Map</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    svg { width: 100vw; height: 100vh; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"><\/script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.4"><\/script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.4"><\/script>
</head>
<body>
  <svg id="markmap"></svg>
  <script>
    const markdown = \`${markdown.replace(/`/g, '\\`').replace(/\${/g, '\\${')}\`;
    const { Transformer, Markmap } = window.markmap;
    const { root } = new Transformer().transform(markdown);
    Markmap.create('#markmap', { zoom: true, pan: true }, root);
  <\/script>
</body>
</html>`;

      const blob = new Blob([standaloneContent], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'interactive-mindmap.html';
      a.click();
      URL.revokeObjectURL(a.href);
    }
  </script>
</body>
</html>

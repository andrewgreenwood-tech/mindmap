<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Interactive Mind Map</title>

  <!-- =====================================================
       MARKMAP
  ====================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.4"></script>

  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.4"></script>


  <!-- =====================================================
       STYLE
  ====================================================== -->

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {

      --background: #f7f8fc;

      --panel: #ffffff;

      --border: #e5e7eb;

      --text: #202124;

      --muted: #73767e;

      --purple: #6750a4;

    }


    html,
    body {

      width: 100%;
      height: 100%;

      overflow: hidden;

    }


    body {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background: var(--background);

      color: var(--text);

    }


    /* =====================================================
       APP
    ====================================================== */

    #app {

      width: 100%;
      height: 100%;

      display: flex;

    }


    /* =====================================================
       SIDEBAR
    ====================================================== */

    #sidebar {

      width: 350px;

      height: 100%;

      padding: 24px;

      display: flex;

      flex-direction: column;

      background: rgba(255,255,255,0.97);

      border-right: 1px solid var(--border);

      box-shadow:
        3px 0 22px rgba(0,0,0,0.035);

      z-index: 10;

    }


    /* =====================================================
       HEADER
    ====================================================== */

    .brand {

      display: flex;

      align-items: center;

      gap: 12px;

      margin-bottom: 7px;

    }


    .brand-icon {

      width: 38px;
      height: 38px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #8972cf,
          #6750a4
        );

      color: white;

      font-size: 19px;

      box-shadow:
        0 4px 12px
        rgba(103,80,164,0.22);

    }


    h1 {

      font-size: 18px;

      font-weight: 650;

    }


    .subtitle {

      margin:
        0 0 20px 50px;

      color: var(--muted);

      font-size: 13px;

      line-height: 1.5;

    }


    /* =====================================================
       LABEL
    ====================================================== */

    .editor-label {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 8px;

      color: #555861;

      font-size: 12px;

      font-weight: 650;

      text-transform: uppercase;

      letter-spacing: 0.6px;

    }


    .editor-hint {

      color: #999ca4;

      font-size: 11px;

      font-weight: 400;

      text-transform: none;

      letter-spacing: 0;

    }


    /* =====================================================
       TEXTAREA
    ====================================================== */

    textarea {

      flex: 1;

      width: 100%;

      padding: 16px;

      resize: none;

      border:
        1px solid
        var(--border);

      border-radius: 16px;

      background: #fbfbfd;

      color: #303238;

      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

      font-size: 13px;

      line-height: 1.7;

      outline: none;

      transition:
        border 0.2s,
        box-shadow 0.2s,
        background 0.2s;

    }


    textarea:hover {

      background: white;

    }


    textarea:focus {

      background: white;

      border-color: #a99bd1;

      box-shadow:
        0 0 0 4px
        rgba(103,80,164,0.08);

    }


    /* =====================================================
       BUTTONS
    ====================================================== */

    .button-area {

      display: flex;

      gap: 8px;

      margin-top: 14px;

    }


    button {

      border: none;

      cursor: pointer;

      font-family: inherit;

      font-size: 12px;

      font-weight: 600;

      transition:
        transform 0.15s,
        box-shadow 0.15s,
        background 0.15s;

    }


    button:active {

      transform: scale(0.97);

    }


    .btn-render {

      flex: 1;

      padding: 13px 12px;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #725bb0,
          #604697
        );

      color: white;

      box-shadow:
        0 4px 12px
        rgba(103,80,164,0.20);

    }


    .btn-render:hover {

      box-shadow:
        0 6px 18px
        rgba(103,80,164,0.28);

    }


    .btn-clear,
    .btn-export {

      padding: 13px 12px;

      border-radius: 12px;

      background: white;

      border:
        1px solid
        var(--border);

      color: #555861;

    }


    .btn-clear:hover {

      background: #fff7f7;

      color: #a14d4d;

    }


    .btn-export:hover {

      background: #f8f7fc;

    }


    /* =====================================================
       MAP
    ====================================================== */

    #map-container {

      flex: 1;

      position: relative;

      overflow: hidden;

      background:

        radial-gradient(
          circle at center,
          #ffffff 0%,
          #f7f8fc 100%
        );

    }


    #markmap-svg {

      width: 100%;

      height: 100%;

    }


    /* =====================================================
       MAP TITLE
    ====================================================== */

    .map-title {

      position: absolute;

      top: 20px;

      left: 24px;

      padding: 9px 14px;

      border-radius: 12px;

      background:
        rgba(255,255,255,0.86);

      border:
        1px solid
        rgba(225,226,232,0.9);

      backdrop-filter: blur(12px);

      box-shadow:
        0 3px 15px
        rgba(0,0,0,0.055);

      color: #5b5d65;

      font-size: 13px;

      font-weight: 600;

      z-index: 5;

      pointer-events: none;

    }


    /* =====================================================
       MAP CONTROLS
    ====================================================== */

    .map-controls {

      position: absolute;

      right: 24px;

      bottom: 24px;

      display: flex;

      flex-direction: column;

      gap: 7px;

      z-index: 5;

    }


    .map-control {

      width: 42px;
      height: 42px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 12px;

      background:
        rgba(255,255,255,0.92);

      border:
        1px solid
        rgba(225,226,232,0.95);

      box-shadow:
        0 4px 15px
        rgba(0,0,0,0.08);

      color: #555761;

      font-size: 19px;

      backdrop-filter: blur(12px);

    }


    .map-control:hover {

      background: white;

    }


    /* =====================================================
       MARKMAP TEXT
    ====================================================== */

    .markmap-node text {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif !important;

      fill: #303238 !important;

    }


    .markmap-link {

      stroke-linecap: round;

    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media (max-width: 800px) {

      #sidebar {

        width: 290px;

        padding: 18px;

      }

      .subtitle {

        margin-left: 0;

      }

      .map-title {

        top: 12px;

        left: 12px;

      }

      .map-controls {

        right: 12px;

        bottom: 12px;

      }

    }

  </style>

</head>


<body>


  <div id="app">


    <!-- ===================================================
         SIDEBAR
    ==================================================== -->

    <aside id="sidebar">


      <div class="brand">

        <div class="brand-icon">
          ✦
        </div>

        <h1>
          Mind Map
        </h1>

      </div>


      <div class="subtitle">

        Turn your Markdown outline
        into an interactive visual map.

      </div>


      <div class="editor-label">

        <span>
          Markdown
        </span>

        <span class="editor-hint">
          Paste from NotebookLM
        </span>

      </div>


      <textarea
        id="markdown-input"
        spellcheck="false"
        placeholder="# Main Topic
## Subtopic
- Key idea
  - Detail
## Another Subtopic
- Important detail"
      ></textarea>


      <div class="button-area">


        <button
          class="btn-render"
          onclick="updateMap()"
        >
          ✦ Generate
        </button>


        <button
          class="btn-clear"
          onclick="clearContent()"
        >
          Clear
        </button>


        <button
          class="btn-export"
          onclick="exportStandaloneHTML()"
        >
          Export
        </button>


      </div>


    </aside>


    <!-- ===================================================
         MAP
    ==================================================== -->

    <main id="map-container">


      <div class="map-title">
        Interactive Mind Map
      </div>


      <svg id="markmap-svg"></svg>


      <div class="map-controls">


        <button
          class="map-control"
          title="Fit map"
          onclick="fitMap()"
        >
          ⛶
        </button>


      </div>


    </main>


  </div>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script>


    /* =====================================================
       MARKMAP
    ====================================================== */

    const {
      Transformer,
      Markmap
    } = window.markmap;


    const transformer =
      new Transformer();


    let mmInstance = null;


    /* =====================================================
       CLEAN NOTEBOOKLM MARKDOWN
       
       Removes:
       
       - Anything before the first #
       - ```markdown
       - ```md
       - ```
       
       It does NOT alter the actual outline.
    ====================================================== */

    function cleanMarkdown(input) {

      if (!input) {

        return "";

      }


      let markdown =
        input
          .replace(/\r\n/g, "\n")
          .trim();


      /*
        Remove opening code fence.
      */

      markdown =
        markdown.replace(
          /^```(?:markdown|md)?\s*/i,
          ""
        );


      /*
        Remove closing code fence.
      */

      markdown =
        markdown.replace(
          /\s*```\s*$/i,
          ""
        );


      /*
        Find the FIRST Markdown heading.

        Everything before it is discarded.
      */

      const heading =
        markdown.match(
          /^#{1,6}\s+/m
        );


      if (heading) {

        markdown =
          markdown.substring(
            heading.index
          );

      }


      return markdown.trim();

    }


    /* =====================================================
       GENERATE MAP
    ====================================================== */

    function updateMap() {


      const textarea =
        document.getElementById(
          "markdown-input"
        );


      /*
        Clean NotebookLM paste.
      */

      const markdown =
        cleanMarkdown(
          textarea.value
        );


      /*
        Put cleaned version back into editor.
      */

      textarea.value =
        markdown;


      if (!markdown) {

        alert(
          "Please paste a Markdown outline beginning with #."
        );

        return;

      }


      /*
        Convert Markdown to Markmap tree.
      */

      const {
        root
      } =
        transformer.transform(
          markdown
        );


      /*
        Get SVG.
      */

      const svg =
        document.getElementById(
          "markmap-svg"
        );


      /*
        Remove previous map.
      */

      svg.innerHTML = "";


      /*
        Create map.
       
        IMPORTANT:
       
        Level 0 = root
        Level 1 = ## sections
        Level 2+ = collapsed
      */

      mmInstance =
        Markmap.create(

          svg,

          {

            duration: 300,

            initialExpandLevel: 1,

            /*
              Space between sibling branches.
            */

            spacingVertical: 18,

            /*
              Space between levels.
            */

            spacingHorizontal: 80,

            /*
              Native Markmap controls.
            */

            zoom: true,

            pan: true

          },

          root

        );


      /*
        Fit map after rendering.
      */

      setTimeout(

        function() {

          if (mmInstance) {

            mmInstance.fit();

          }

        },

        400

      );

    }


    /* =====================================================
       CLEAR EVERYTHING
    ====================================================== */

    function clearContent() {


      document
        .getElementById(
          "markdown-input"
        )
        .value = "";


      document
        .getElementById(
          "markmap-svg"
        )
        .innerHTML = "";


      mmInstance = null;


      document
        .getElementById(
          "markdown-input"
        )
        .focus();

    }


    /* =====================================================
       FIT MAP
    ====================================================== */

    function fitMap() {

      if (!mmInstance) {

        return;

      }


      mmInstance.fit();

    }


    /* =====================================================
       CTRL + ENTER
    ====================================================== */

    document
      .getElementById(
        "markdown-input"
      )
      .addEventListener(

        "keydown",

        function(event) {

          if (

            (event.ctrlKey ||
             event.metaKey) &&

            event.key === "Enter"

          ) {

            event.preventDefault();

            updateMap();

          }

        }

      );


    /* =====================================================
       EXPORT
       
       IMPORTANT:
       
       The Markdown is NOT inserted directly into a
       JavaScript string.
       
       Instead it is placed into a hidden textarea
       in the exported HTML.
       
       This makes the export extremely reliable even
       with complicated NotebookLM Markdown.
    ====================================================== */

    function exportStandaloneHTML() {


      const markdown =
        cleanMarkdown(

          document
            .getElementById(
              "markdown-input"
            )
            .value

        );


      if (!markdown) {

        alert(
          "There is no mind map to export."
        );

        return;

      }


      /*
        Encode the Markdown as HTML text.

        This protects:
        < > & "
      */

      const encodedMarkdown =
        markdown
          .replace(
            /&/g,
            "&amp;"
          )
          .replace(
            /</g,
            "&lt;"
          )
          .replace(
            />/g,
            "&gt;"
          )
          .replace(
            /"/g,
            "&quot;"
          );


      /*
        Build standalone HTML.
      */

      const standaloneContent = `<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Interactive Mind Map</title>


<script src="https://cdn.jsdelivr.net/npm/d3@7"><\/script>

<script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.4"><\/script>

<script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.4"><\/script>


<style>

html,
body {

  width: 100%;
  height: 100%;

  margin: 0;

  overflow: hidden;

  background:

    radial-gradient(
      circle at center,
      #ffffff 0%,
      #f7f8fc 100%
    );

}


#markmap {

  width: 100vw;

  height: 100vh;

}


.markmap-node text {

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    sans-serif !important;

  fill: #303238 !important;

}


.markmap-link {

  stroke-linecap: round;

}

</style>

</head>


<body>


<!--
  The actual Markdown content is stored here.
  It is NOT executable JavaScript.
-->

<textarea id="markdown-data" style="display:none;">${encodedMarkdown}</textarea>


<svg id="markmap"></svg>


<script>


/*
  Read the actual Markdown from the hidden textarea.
*/

const markdown =
  document.getElementById(
    "markdown-data"
  ).value;


/*
  Convert Markdown to a Markmap tree.
*/

const {
  Transformer,
  Markmap
} = window.markmap;


const transformer =
  new Transformer();


const {
  root
} =
  transformer.transform(
    markdown
  );


/*
  Create the exported map.

  Same settings as the main application.
*/

const mm =
  Markmap.create(

    "#markmap",

    {

      duration: 300,

      initialExpandLevel: 1,

      spacingVertical: 18,

      spacingHorizontal: 80,

      zoom: true,

      pan: true

    },

    root

  );


/*
  Fit the map once rendered.
*/

setTimeout(

  function() {

    mm.fit();

  },

  500

);


<\/script>


</body>

</html>`;


      /*
        Create the HTML file.
      */

      const blob =
        new Blob(

          [standaloneContent],

          {
            type:
              "text/html;charset=utf-8"
          }

        );


      /*
        Create temporary download URL.
      */

      const url =
        URL.createObjectURL(
          blob
        );


      /*
        Create download link.
      */

      const link =
        document.createElement(
          "a"
        );


      link.href = url;

      link.download =
        "interactive-mindmap.html";


      document.body.appendChild(
        link
      );


      link.click();


      document.body.removeChild(
        link
      );


      /*
        Release URL after download begins.
      */

      setTimeout(

        function() {

          URL.revokeObjectURL(
            url
          );

        },

        2000

      );

    }


  </script>


</body>

</html>
